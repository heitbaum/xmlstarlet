# XMLStarlet release
#
# On a version tag (e.g. 1.7.0, or a 1.7.0-rc1 pre-release) build the release
# assets and stage a GitHub Release as a draft, to publish once tidied (an -rc
# is flagged a pre-release):
#   * source tarball    - `make dist`, with the full documentation baked in
#   * windows-<arch> zip - a self-contained, statically linked xml.exe + docs,
#                          cross-built via mingw/GNUmakefile for x86_64 and arm64
# workflow_dispatch runs the same builds as a dry-run: it uploads the assets as
# workflow artifacts and creates NO Release, so they can be inspected before
# tagging. The version is baked from git describe, so tag 1.7.0 yields
# xmlstarlet-1.7.0.tar.gz, xmlstarlet-1.7.0-windows-x86_64.zip and
# xmlstarlet-1.7.0-windows-arm64.zip.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'          # release, e.g. 1.7.0
      - '[0-9]+.[0-9]+.[0-9]+-rc[0-9]+' # pre-release, e.g. 1.7.0-rc1
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref for a dry-run build (blank = this branch)"
        required: false

permissions:
  contents: write   # publish the GitHub Release

jobs:
  # Source distribution tarball (with man/text/HTML/PDF/PS docs) - the primary
  # release asset.
  dist:
    name: source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # tags for git describe -> baked version

      - name: Install build + documentation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libxml2-dev libxslt1-dev xsltproc \
            docbook-xsl docbook-xsl-ns docbook-xml fop ghostscript

      - name: make dist
        run: |
          set -eux
          export XML_CATALOG_FILES=/etc/xml/catalog
          autoreconf -fi
          ./configure --enable-build-docs
          make -j"$(nproc)"
          make dist
          for t in xmlstarlet-*.tar.gz; do sha256sum "$t" > "$t.sha256"; done
          ls -la xmlstarlet-*.tar.gz*

      - uses: actions/upload-artifact@v7
        with:
          name: source-tarball
          path: |
            xmlstarlet-*.tar.gz
            xmlstarlet-*.tar.gz.sha256

  # Self-contained, statically linked xml.exe + docs for each Windows CPU,
  # cross-built by the mingw driver (mingw/GNUmakefile): x86_64 via
  # gcc-mingw-w64, arm64 via a pinned llvm-mingw. This is also the only place
  # the Windows cross-build is exercised end to end.
  windows:
    name: windows-${{ matrix.arch }} zip
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # tags for git describe -> zip version

      - name: Install documentation + common build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            curl xz-utils zip \
            xsltproc docbook-xsl docbook-xsl-ns docbook-xml fop ghostscript

      - name: Install x86_64 cross toolchain (gcc-mingw-w64)
        if: matrix.arch == 'x86_64'
        run: sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      # Ubuntu has no aarch64 mingw target; use a pinned, checksum-verified
      # llvm-mingw toolchain (provides aarch64-w64-mingw32-*).
      - name: Install arm64 cross toolchain (llvm-mingw)
        if: matrix.arch == 'arm64'
        env:
          LLVM_MINGW: llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          LLVM_MINGW_SHA256: 534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda
        run: |
          set -eux
          curl -fsSL -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  llvm-mingw.tar.xz" | sha256sum -c -
          sudo tar -xf llvm-mingw.tar.xz -C /opt
          echo "/opt/$LLVM_MINGW/bin" >> "$GITHUB_PATH"

      # Cache the cross-built dependency stack (downloaded tarballs + the static
      # zlib/iconv/libxml2/libxslt). Keyed on arch + versions.mk.
      - name: Cache the cross-built dependency stack
        uses: actions/cache@v6
        with:
          path: |
            mingw/build-${{ matrix.arch }}
            mingw/*.tar.gz
            mingw/*.tar.xz
          key: mingw-deps-${{ matrix.arch }}-${{ hashFiles('mingw/versions.mk') }}

      - name: Cross-build the windows-${{ matrix.arch }} zip
        run: |
          set -eux
          export XML_CATALOG_FILES=/etc/xml/catalog
          autoreconf -fi
          make -C mingw ARCH=${{ matrix.arch }}
          mkdir -p out
          cp mingw/xmlstarlet-*-${{ matrix.arch }}/xmlstarlet-*-windows-${{ matrix.arch }}.zip out/
          cd out
          for z in xmlstarlet-*-windows-${{ matrix.arch }}.zip; do sha256sum "$z" > "$z.sha256"; done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-zip
          path: out/*

  # On a version tag, publish a GitHub Release with all assets.
  release:
    name: publish release
    needs: [dist, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all tags, so notes can span from the last stable

      - uses: actions/download-artifact@v7
        with:
          path: assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          find assets -type f
          # Every release is created as a DRAFT so the auto-generated,
          # label-categorised notes (see .github/release.yml) can be tidied
          # before it is published; an -rc is additionally flagged a
          # pre-release. Notes range: a pre-release spans the previous tag
          # (incl. an earlier -rc) so each RC lists only what is new; a final
          # spans the previous *stable* tag, covering the whole cycle.
          case "${GITHUB_REF_NAME}" in
            *-rc*) publish="--draft --prerelease"
                   start=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true) ;;
            *)     publish=--draft
                   start=$(git describe --tags --abbrev=0 --exclude='*-rc*' "${GITHUB_REF_NAME}^" 2>/dev/null || true) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "XMLStarlet ${GITHUB_REF_NAME}" \
            --generate-notes ${start:+--notes-start-tag "$start"} \
            $publish \
            $(find assets -type f | sort)
